<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Jopips | AI-Powered Platform</title>
    <meta name="title" content="Jopips | AI-Powered Platform" />
    <meta
      name="description"
      content="Jopips is an AI-powered platform built for modern businesses, automation, and productivity."
    />
    <meta
      name="keywords"

    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jopips1.vercel.app/" />
    <meta property="og:title" content="Jopips | AI-Powered Platform" />

      property="og:description"
      content="Modern AI-powered platform for business and productivity."

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Jopips | AI-Powered Platform"
    />
    <meta
      name="twitter:description"
      content="Modern AI-powered platform for business and productivity."
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Styling -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;

      }

      #root {
        height: 100%;
